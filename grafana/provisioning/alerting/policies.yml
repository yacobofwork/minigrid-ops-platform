# =============================================================================
# Mini-Grid O&M — 告警分级与通知策略
# -----------------------------------------------------------------------------
# 分级对应 JD 的 on-call 定义：
#   P1 critical —— 监控/Odoo/VPN/服务器丢失或疑似安全事件，30 分钟内确认
#   P2 warning  —— 重要但可等到下一个工作日处理
#   P3 info     —— 趋势提示，无需立即行动
#
# 路由设计：
#   P1: 立即发送 + 每 30 分钟重复，直到确认（呼应 JD "ack within 30 minutes"）
#   P2: 5 分钟聚合后发送，4 小时重复
#   P3: 每日一条摘要
# =============================================================================
apiVersion: 1

policies:
  - orgId: 1
    receiver: minigrid-email
    group_by: [alertname, site_id]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # --- P1: 立即、高频重复 ------------------------------------------
      - receiver: minigrid-email
        matchers:
          - severity = critical
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 30m
        continue: false
      # --- P3: 每日摘要 -------------------------------------------------
      - receiver: minigrid-email
        matchers:
          - severity = info
        group_wait: 5m
        group_interval: 12h
        repeat_interval: 24h
        continue: false
