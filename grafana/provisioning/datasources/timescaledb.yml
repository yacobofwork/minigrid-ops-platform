# =============================================================================
# Grafana 数据源自动配置
# 容器启动时自动挂载生效，无需手工在 UI 中添加数据源。
# =============================================================================
apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: TimescaleDB
    type: postgres
    access: proxy
    url: ${DB_HOST}:5432
    database: ${DB_NAME}
    user: ${DB_USER}
    isDefault: true
    editable: false
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
    secureJsonData:
      password: ${DB_PASSWORD}
